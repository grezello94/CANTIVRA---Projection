name: Desktop verification

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      native_smoke:
        description: Run native process fault tests (requires a usable desktop session)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15
          - platform: windows
            runner: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      - name: Native process fault tests
        if: github.event_name == 'workflow_dispatch' && inputs.native_smoke
        run: dart run tool/run_native_smoke.dart ${{ matrix.platform }}

      # Always rebuild the normal entrypoint after the test harness. Packaging
      # verifies local macOS signatures and records toolchain/lockfile hashes.
      # Windows is unsigned unless an explicit local certificate is configured.
      - name: Build and package normal desktop application
        run: dart run tool/package_desktop.dart ${{ matrix.platform }}

      - name: Preserve development build
        uses: actions/upload-artifact@v4
        with:
          name: cantivra-${{ matrix.platform }}-${{ github.sha }}
          path: dist/Cantivra-*
          if-no-files-found: error
          retention-days: 14
