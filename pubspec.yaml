name: cantivra
description: Offline church presentation and service planning for Windows and macOS.
publish_to: none
version: 0.3.4+7

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  sqlite3: ^3.1.0
  characters: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/fonts/Roboto_LICENSE.txt
    - assets/images/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
  config:
    enable-swift-package-manager: true
  uses-material-design: true
